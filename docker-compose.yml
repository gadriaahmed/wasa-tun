# Run Wasabi locally with Cassandra and MySQL.
# Prerequisite: build the app once so the wasabi image can be built:
#   ./bin/build.sh -b true -p development
# Then: docker compose up -d

services:
  cassandra:
    image: cassandra:3.11
    container_name: wasabi-cassandra
    ports:
      - "9042:9042"
      - "9160:9160"
    # Give Cassandra time to start before init runs
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || true"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mysql:
    image: mysql:5.6
    container_name: wasabi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: wasabi
      MYSQL_USER: readwrite
      MYSQL_PASSWORD: readwrite
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmypass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Creates Cassandra keyspace (run once per up, then exits)
  wasabi-keyspace:
    build:
      context: ./bin/docker
      dockerfile: cqlsh.docker
    image: wasabi-keyspace:latest
    environment:
      CASSANDRA_KEYSPACE_PREFIX: wasabi
      CQLSH_HOST: cassandra
      CASSANDRA_PORT: "9042"
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  # Runs Cassandra schema migration (run once per up, then exits)
  wasabi-migration:
    build:
      context: .
      dockerfile: bin/docker/migration.docker
    image: wasabi-migration:latest
    environment:
      CQLSH_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: wasabi_experiments
    depends_on:
      wasabi-keyspace:
        condition: service_completed_successfully
    restart: "no"

  wasabi:
    build:
      context: ./modules/main/target/${WASABI_APP_ID}
      dockerfile: Dockerfile
    image: wasabi-main:latest
    container_name: wasabi-main
    environment:
      WASABI_CONFIGURATION: "-Dcassandra.experiments.nodeHosts=cassandra -Dcassandra.events.nodeHosts=cassandra -Ddatabase.url.host=mysql"
    ports:
      - "8080:8080"
      - "8090:8090"
      - "8180:8180"
    depends_on:
      cassandra:
        condition: service_healthy
      mysql:
        condition: service_healthy
      wasabi-migration:
        condition: service_completed_successfully
