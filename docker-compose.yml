# Run Wasabi locally with Redis and PostgreSQL.
# Quick start: make dev   or   ./bin/dev.sh

services:
  redis:
    image: redis:7-alpine
    container_name: wasabi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: wasabi-postgres
    environment:
      POSTGRES_DB: wasabi
      POSTGRES_USER: readwrite
      POSTGRES_PASSWORD: readwrite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readwrite -d wasabi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  wasabi:
    build:
      context: ./modules/main/target/${WASABI_APP_ID}
      dockerfile: Dockerfile
    image: wasabi-main:latest
    container_name: wasabi-main
    environment:
      WASABI_CONFIGURATION: "-Dredis.host=redis -Dwasabi.repository.backend=redis -Ddatabase.url.host=postgres -Xms512m -Xmx512m"
    ports:
      - "8088:8080"
      - "8090:8090"
      - "8180:8180"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
