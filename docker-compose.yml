# Run Wasabi locally with Cassandra and PostgreSQL.
# Quick start: make dev   or   ./bin/dev.sh

services:
  cassandra:
    image: cassandra:3.11
    container_name: wasabi-cassandra
    ports:
      - "9042:9042"
      - "9160:9160"
    # Give Cassandra time to start before init runs
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || true"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: wasabi-postgres
    environment:
      POSTGRES_DB: wasabi
      POSTGRES_USER: readwrite
      POSTGRES_PASSWORD: readwrite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readwrite -d wasabi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Creates Cassandra keyspace (run once per up, then exits)
  wasabi-keyspace:
    build:
      context: ./bin/docker
      dockerfile: cqlsh.docker
    image: wasabi-keyspace:latest
    environment:
      CASSANDRA_KEYSPACE_PREFIX: wasabi
      CQLSH_HOST: cassandra
      CASSANDRA_PORT: "9042"
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  # Runs Cassandra schema migration (run once per up, then exits)
  wasabi-migration:
    build:
      context: .
      dockerfile: bin/docker/migration.docker
    image: wasabi-migration:latest
    environment:
      CQLSH_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: wasabi_experiments
    depends_on:
      wasabi-keyspace:
        condition: service_completed_successfully
    restart: "no"

  wasabi:
    build:
      context: ./modules/main/target/${WASABI_APP_ID}
      dockerfile: Dockerfile
    image: wasabi-main:latest
    container_name: wasabi-main
    environment:
      WASABI_CONFIGURATION: "-DnodeHosts=cassandra -Ddatabase.url.host=postgres -Xms512m -Xmx512m"
    ports:
      - "8088:8080"
      - "8090:8090"
      - "8180:8180"
    depends_on:
      cassandra:
        condition: service_healthy
      postgres:
        condition: service_healthy
      wasabi-migration:
        condition: service_completed_successfully
